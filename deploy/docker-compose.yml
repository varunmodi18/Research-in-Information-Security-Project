# docker compose -f deploy/docker-compose.yml up -d   (IMPLEMENTATION_PLAN.md §7.2)
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      MAKA_DB_URL: sqlite:////app/var/maka.db
      MAKA_BIND: 0.0.0.0:8000      # inside the container; published on the host's loopback only
      MAKA_COOKIE_SECURE: "false"  # plain http on 127.0.0.1 (local demo, §3.5 exclusions)
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - maka-var:/app/var
    restart: unless-stopped
volumes:
  maka-var: {}
