[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maka-2019"
version = "0.1.0"
description = "Reference implementation of the MAKA scheme (Harbi et al., 2019) and its ICMDS baseline"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[project.scripts]
maka = "maka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maka_server = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*httpx2.*"]
markers = [
    "baseline: M0-T3 checks of MAKA_IMPLEMENTATION_REPORT.md claims (IMPLEMENTATION_PLAN.md M0-T3)",
    "slow: demo/secure parameters, net fixtures, E2E; run at checkpoints (IMPLEMENTATION_PLAN.md §6.4)",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom (IMPLEMENTATION_PLAN.md §4.1)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends"]
