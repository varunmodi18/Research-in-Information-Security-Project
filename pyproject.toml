[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maka-2019"
version = "0.1.0"
description = "Reference implementation of the MAKA scheme (Harbi et al., 2019) and its ICMDS baseline"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[project.scripts]
maka = "maka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "baseline: M0-T3 checks of MAKA_IMPLEMENTATION_REPORT.md claims (IMPLEMENTATION_PLAN.md M0-T3)",
    "slow: demo/secure parameters, net fixtures, E2E; run at checkpoints (IMPLEMENTATION_PLAN.md §6.4)",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
