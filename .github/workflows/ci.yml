# IMPLEMENTATION_PLAN.md M0-T5: lint, type check and the test suite excluding `slow` (python job);
# TypeScript check, production build and the Playwright journeys against web/e2e/serve.sh (web job).
# Slow tests (demo/secure params, net fixtures) run at checkpoints via `make ci-slow`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # the server extra is needed: mypy --strict and the tests cover src/maka_server
      - run: python -m pip install -e ".[dev,server]"
      - run: make ci PYTHON=python

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[server]"
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npm run build
        working-directory: web
      # serve.sh starts the backend with $PYTHON (default .venv/bin/python, absent in CI)
      - run: npx playwright test
        working-directory: web
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
